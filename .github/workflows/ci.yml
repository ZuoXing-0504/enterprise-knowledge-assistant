name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: knowledge_base
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_base"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      JWT_SECRET_KEY: ci-secret-key-at-least-32-characters-long
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/knowledge_base
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          python -m ruff check app tests
          python -m ruff format --check app tests

      - name: Enable pgvector extension
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://postgres:postgres@localhost:5432/knowledge_base"
              )
              try:
                  await connection.execute("CREATE EXTENSION IF NOT EXISTS vector")
              finally:
                  await connection.close()

          asyncio.run(main())
          PY

      - name: Validate database migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run test suite with coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80
