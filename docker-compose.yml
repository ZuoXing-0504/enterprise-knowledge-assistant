name: enterprise-knowledge-assistant

x-app: &app
  image: enterprise-knowledge-assistant:dev
  build:
    context: .
    args:
      INSTALL_DEV: "true"
  env_file:
    - path: .env
      required: false
  environment:
    APP_ENV: ${APP_ENV:-development}
    APP_DEBUG: ${APP_DEBUG:-true}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-secret-change-before-production}
    JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-knowledge_base}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    UPLOAD_DIR: /app/uploads
    MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
    CHUNK_SIZE: ${CHUNK_SIZE:-1000}
    CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
    OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
    EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
    MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-60}
    MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
    MODEL_RETRY_BASE_SECONDS: ${MODEL_RETRY_BASE_SECONDS:-0.5}
    OPENAI_EMBEDDING_SEND_DIMENSIONS: ${OPENAI_EMBEDDING_SEND_DIMENSIONS:-false}
    OPENAI_CHAT_MAX_TOKENS: ${OPENAI_CHAT_MAX_TOKENS:-1000}
    RAG_TOP_K: ${RAG_TOP_K:-5}
    RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.2}
    RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-12000}
    CITATION_EXCERPT_CHARS: ${CITATION_EXCERPT_CHARS:-240}
    CHAT_RATE_LIMIT_REQUESTS: ${CHAT_RATE_LIMIT_REQUESTS:-20}
    CHAT_RATE_LIMIT_WINDOW_SECONDS: ${CHAT_RATE_LIMIT_WINDOW_SECONDS:-60}
    EMBEDDING_CACHE_TTL_SECONDS: ${EMBEDDING_CACHE_TTL_SECONDS:-3600}
    MODEL_INPUT_COST_PER_1M_TOKENS: ${MODEL_INPUT_COST_PER_1M_TOKENS:-0}
    MODEL_OUTPUT_COST_PER_1M_TOKENS: ${MODEL_OUTPUT_COST_PER_1M_TOKENS:-0}
  volumes:
    - uploads:/app/uploads
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"

  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    <<: *app
    hostname: worker
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=INFO
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from app.tasks.celery_app import celery_app;
          import sys;
          result = celery_app.control.inspect(destination=['celery@worker'], timeout=5).ping();
          sys.exit(0 if result else 1)
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  uploads:
