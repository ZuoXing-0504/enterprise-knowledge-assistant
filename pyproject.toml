[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-knowledge-assistant"
version = "0.1.0"
description = "A portfolio-ready enterprise knowledge base assistant built with FastAPI and native Python RAG."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiofiles>=24.1,<25.0",
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "celery[redis]>=5.4,<6.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pgvector>=0.3,<1.0",
  "pymupdf>=1.25,<2.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "pyjwt>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "redis>=5.2,<7.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
